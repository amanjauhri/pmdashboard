<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PM Dashboard</title>
<style>
:root{--bg:#0f1117;--panel:#171a23;--line:#262b38;--fg:#e8eaf0;--muted:#9aa1b2;--fin:#14b8a6;--mkt:#6366f1;--case:#f59e0b;--ai:#ec4899;--lab:#0ea5e9;--li:#0a66c2;--brain:#a855f7;--vc:#10b981;--up:#22c55e;--down:#f43f5e;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px;display:flex;flex-direction:column;gap:28px}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:22px 24px;background:linear-gradient(125deg,rgba(99,102,241,.32),rgba(236,72,153,.22) 55%,rgba(20,184,166,.22));border:1px solid rgba(99,102,241,.35)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.35),transparent 70%)}
.eyebrow{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
h1{margin:4px 0 6px;font-family:var(--serif);font-weight:400;font-size:clamp(24px,4vw,34px);line-height:1.15}
.hero p.sub{margin:0;opacity:.85;position:relative;z-index:1}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative;z-index:1}
.nav a{display:inline-flex;gap:6px;font-size:12px;text-decoration:none;color:var(--fg);border-radius:999px;padding:5px 12px;background:color-mix(in srgb,var(--acc) 18%,var(--bg));border:1px solid color-mix(in srgb,var(--acc) 45%,transparent)}
.sec{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--acc) 22%,transparent);border:1px solid color-mix(in srgb,var(--acc) 45%,transparent)}
.sec-h h2{margin:0;font-size:19px;font-weight:600}
.sec-h .sub{margin-left:auto}
.sub{margin:0;color:var(--muted);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.tint{background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 12%,var(--panel)),var(--panel) 70%);border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
.card h3{margin:0;font-size:15px;font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.kpi{border-radius:14px;padding:14px 16px;background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 20%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line))}
.kl{margin:0;color:var(--muted);font-size:12px}
.kv{margin:2px 0 0;font-family:var(--serif);font-size:clamp(22px,3vw,28px);font-variant-numeric:tabular-nums;line-height:1.15}
.kn{margin:2px 0 0;font-size:12px;color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}
.chip{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
.chip.up{background:rgba(34,197,94,.16)}.chip.down{background:rgba(244,63,94,.16)}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--acc) 16%,transparent);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
svg text{fill:var(--muted);font-size:11px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:8px;align-items:center;font-size:12px}
.track{height:10px;border-radius:999px;background:color-mix(in srgb,var(--acc) 12%,transparent);overflow:hidden}
.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#fff))}
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ins li{display:flex;gap:8px;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--tone) 10%,transparent);border-left:3px solid var(--tone)}
.ins li.good{--tone:var(--up)}.ins li.bad{--tone:var(--down)}.ins li.info{--tone:#0ea5e9}
.movers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.movers li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.04);font-size:12px}
.movers .s{font-weight:600}.movers .m{color:var(--muted)}
.split{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
.r{text-align:right;white-space:nowrap}
details.d{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel)}
details.d>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px}
details.d>summary:before{content:"▸";color:var(--acc)}
details.d[open]>summary:before{content:"▾"}
details.d[open]>summary{margin-bottom:12px}
select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:12px}
.prompt{margin:0;font-family:var(--serif);font-size:clamp(18px,2.4vw,22px);line-height:1.4}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));counter-reset:st}
.steps li{counter-increment:st;position:relative;padding:12px 12px 12px 48px;border-radius:12px;background:color-mix(in srgb,var(--acc) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--acc) 25%,var(--line))}
.steps li:before{content:counter(st);position:absolute;left:12px;top:12px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--acc);color:#fff}
.steps b{display:block;margin-bottom:3px}
.steps span{font-size:12px;color:var(--muted)}
dl.ans{display:grid;grid-template-columns:max-content 1fr;gap:8px 14px;margin:0}
dl.ans dt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--acc);padding-top:3px}
dl.ans dd{margin:0}
.qa{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.qa li{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--acc) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--acc) 22%,var(--line))}
.qa b{display:block;margin-bottom:4px}
.qa span{display:block;font-size:12px;color:var(--muted)}
.qa span:before{content:"Say: ";font-weight:700;color:var(--acc)}
.callout{margin:0;padding:10px 12px;border-radius:10px;font-size:13px;background:color-mix(in srgb,var(--acc) 12%,transparent);border-left:3px solid var(--acc)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow span{padding:8px 12px;border-radius:10px;font-size:12px;background:color-mix(in srgb,var(--acc) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.flow em{font-style:normal;color:var(--acc);font-weight:700}
.mini{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:rgba(255,255,255,.04)}
.mini .h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--acc)}
.mini p{margin:0;font-size:13px}
.news{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.ni{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:rgba(255,255,255,.04)}
.ni h4{margin:0;font-size:15px;line-height:1.35}
.ni h4 a{color:inherit;text-decoration:none}
.note{margin:0;font-size:12px;color:var(--muted)}
.why{margin:0;font-size:12px;padding:6px 8px;border-radius:8px;background:color-mix(in srgb,var(--acc) 10%,transparent)}
.warn{margin:0;padding:10px 12px;border-radius:10px;font-size:12px;background:rgba(245,158,11,.12);border-left:3px solid #f59e0b}
.lock{min-height:100vh;display:grid;place-items:center;padding:20px}
.lock form{width:min(360px,100%);display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.lock input[type=password]{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
.lock button{padding:10px 12px;border-radius:10px;border:0;background:linear-gradient(90deg,#6366f1,#ec4899);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.lock label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.err{color:var(--down);font-size:12px;margin:0;min-height:1em}
.sm{display:none;font-size:11px;color:var(--muted);font-weight:400}
@media (max-width:640px){.hm{display:none}.sm{display:block}.wrap{padding:16px 12px 48px;gap:22px}.hero{padding:18px}.card{padding:14px}td,th{padding:6px 5px}.sec-h .sub{margin-left:0;width:100%}dl.ans{grid-template-columns:1fr;gap:2px 0}.days li{grid-template-columns:70px 64px 1fr}dl.ans dd{margin-bottom:8px}.bar{grid-template-columns:minmax(70px,34%) 1fr auto}}
.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.days li{display:grid;grid-template-columns:88px 78px 1fr;gap:8px;align-items:baseline;font-size:12px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.03)}
.days li.hi{background:rgba(244,63,94,.10)}
.days .a{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.days .t{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.catm{grid-column:1/-1;font-size:11px;color:var(--muted);margin:-4px 0 2px}
.cc{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:rgba(255,255,255,.04)}
.cc .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.cc .nm{font-weight:700}
.cc .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;font-size:12px}
.cc .stats b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.cc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12px}
.cc ul li{display:flex;justify-content:space-between;gap:8px}
.cc ul li span:first-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 22%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line))}
.term .w{font-family:var(--serif);font-size:22px}
.term p{margin:0;font-size:13px}
.script p{margin:0 0 10px;font-size:14px;line-height:1.55}
.script b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--acc);margin-bottom:2px}
.li{display:flex;flex-direction:column;gap:10px}
.li .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.li h4{margin:0;font-size:16px;line-height:1.35}
.li h4 a{color:inherit}
.li ul.pts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.li .links{display:flex;flex-wrap:wrap;gap:6px}
.li .links a{font-size:11px;color:var(--fg);text-decoration:none;padding:3px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.foot{text-align:center;font-size:11px;color:var(--muted)}

.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.qlist li{display:flex;gap:10px;align-items:baseline;font-size:13px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.qlist li span{color:var(--muted);font-size:12px;white-space:nowrap}
.qlist li a{color:var(--fg);word-break:break-all}
.bg-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.bg-tabs button,.bg-btn{font:inherit;font-size:13px;color:var(--fg);background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));border-radius:999px;padding:7px 14px;cursor:pointer}
.bg-tabs button.on,.bg-btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.bg-stage{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;border-radius:14px;background:rgba(0,0,0,.18)}
.bg-big{font-size:clamp(28px,8vw,46px);font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.bg-big.ok{color:var(--up)}.bg-big.no{color:var(--down);font-size:24px}
.bg-sub{margin:0;color:var(--muted);font-size:13px}
.bg-in{font:inherit;font-size:22px;text-align:center;width:min(240px,80vw);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.bg-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bg-stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.bg-stats b{color:var(--fg)}
.vc-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.vc-prog{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0 4px}
.vc-prog i{display:block;height:100%;background:var(--acc)}
.vc-idea{font-family:var(--serif);font-size:19px;line-height:1.4;margin:6px 0 0}
.vc-body p{margin:0 0 10px;font-size:14px;line-height:1.6}
.vc-ex{border-radius:14px;padding:14px;background:color-mix(in srgb,var(--acc) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--acc) 25%,var(--line))}
.vc-ex ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;line-height:1.5}
.vc-ex table{margin-top:12px}
.vc-nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.vc-nav select{max-width:100%}
.vc-map{display:grid;gap:10px}
.vc-map .wk{font-size:12px;font-weight:700;color:var(--acc);margin:4px 0 2px}
.vc-map ol{margin:0;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.vc-map a{color:var(--fg);cursor:pointer}
.vc-map li.done a{color:var(--muted);text-decoration:line-through}
.vc-map li.cur a{color:var(--acc);font-weight:700}
</style>
</head>
<body>
<div id="app">
  <div class="lock"><form id="lockform">
    <h1 style="font-size:22px;margin:0">PM Dashboard</h1>
    <p class="sub">Enter your password to open today's notes.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" autofocus>
    <label><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button type="submit">Open</button>
    <p class="err" id="err"></p>
  </form></div>
</div>

async function openWithKey(raw) {

}
(async () => {

    ev.preventDefault();
    const err = document.getElementById('err'); err.textContent = 'Opening…';
    try {
      const raw = await unwrap(document.getElementById('pw').value);
      const data = await openWithKey(raw);
      if (document.getElementById('remember').checked) { try { localStorage.setItem('pmd_k', ub64(raw)); } catch (_) {} }
      render(data);
    } catch (e) { err.textContent = 'Wrong password.'; }
  });
})();

const inr = new Intl.NumberFormat('en-IN', {style: 'currency', currency: 'INR', maximumFractionDigits: 0});
const INR = (v) => v == null || isNaN(v) ? '—' : inr.format(v);
const INRk = (v) => { if (v == null || isNaN(v)) return '—'; const a = Math.abs(v), s = v < 0 ? '-' : ''; if (a >= 1e5) return s + '₹' + (a / 1e5).toFixed(2) + 'L'; if (a >= 1e3) return s + '₹' + (a / 1e3).toFixed(1) + 'k'; return s + '₹' + Math.round(a); };
const SGN = (v) => v == null || isNaN(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + inr.format(Math.abs(v));
const PCT = (v) => v == null || isNaN(v) ? '—' : (v > 0 ? '▲ ' : v < 0 ? '▼ ' : '') + Math.abs(v * 100).toFixed(1) + '%';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const lines = (s) => String(s || '').split(String.fromCharCode(10)).filter(Boolean);
const fdate = (iso, o) => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-IN', Object.assign({timeZone: 'UTC'}, o || {day: 'numeric', month: 'short'}));
const ret = (h) => h.average_price ? (h.last_price - h.average_price) / h.average_price : 0;
const chip = (v, invert) => `<span class="chip ${v == null ? '' : ((invert ? v < 0 : v > 0) ? 'up' : (invert ? v > 0 : v < 0) ? 'down' : '')}">${PCT(v)}</span>`;
const ICON = {good: '✅', bad: '⚠️', info: '💡'};
const insights = (arr) => `<ul class="ins">${(arr || []).map((r) => `<li class="${esc(r.tone)}"><span>${ICON[r.tone] || '•'}</span><span>${esc(r.text)}</span></li>`).join('')}</ul>`;

function dayChart(days, avg, today) {
  if (!days || !days.length) return '<p class="note">No spending data.</p>';
  const W = 520, H = 150, m = {t: 8, r: 4, b: 18, l: 46};
  const max = Math.max(1, ...days.map((d) => d.amount));
  const step = Math.pow(10, Math.floor(Math.log10(max))); const nice = Math.ceil(max / step) * step;
  const y = (v) => H - m.b - (v / nice) * (H - m.t - m.b);
  const bw = (W - m.l - m.r) / days.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Spend per day">`;
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4; s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="#262b38"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${INRk(v)}</text>`; }
  days.forEach((d, i) => { const h = Math.max(d.amount > 0 ? 2 : 0, y(0) - y(d.amount)); const col = d.day > today ? '#3a3f4d' : (avg && d.amount > avg * 1.5 ? 'var(--down)' : 'var(--fin)'); s += `<rect x="${m.l + i * bw + bw * .15}" width="${bw * .7}" y="${y(0) - h}" height="${h}" rx="2" fill="${col}"><title>${fdate(d.day, {weekday: 'short', day: 'numeric', month: 'short'})} · ${INR(d.amount)}</title></rect>`; });
  if (avg) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(avg)}" y2="${y(avg)}" stroke="#9aa1b2" stroke-dasharray="3 3"/><text x="${W - m.r}" y="${y(avg) - 4}" text-anchor="end">avg ${INR(avg)}</text>`;
  days.map((d, i) => [d, i]).filter(([d]) => d.amount > 0).sort((a, b) => b[0].amount - a[0].amount).slice(0, 3).forEach(([d, i]) => { s += `<text x="${m.l + (i + .5) * bw}" y="${y(d.amount) - 3}" text-anchor="middle" style="fill:var(--fg);font-size:10px">${INRk(d.amount)}</text>`; });
  [1, 8, 15, 22, 29].filter((n) => n <= days.length).forEach((n) => { s += `<text x="${m.l + (n - .5) * bw}" y="${H - 4}" text-anchor="middle">${n}</text>`; });
  return s + '</svg>';

function lineChart(rows) {
  if (!rows || rows.length < 2) return `<p class="note">${rows && rows.length ? `Tracking started ${fdate(rows[0].date)} at ${INR(rows[0].value)}. The line appears after the next morning's snapshot.` : 'No snapshots yet.'}</p>`;

  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Portfolio value over time">`;
  for (let i = 0; i <= 3; i++) { const v = lo + (hi - lo) * i / 3; s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="#262b38"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${INRk(v)}</text>`; }

  s += `<polyline fill="none" stroke="var(--mkt)" stroke-width="2.5" points="${rows.map((r, i) => x(i) + ',' + y(r.value)).join(' ')}"/>`;
  rows.forEach((r, i) => { s += `<circle cx="${x(i)}" cy="${y(r.value)}" r="3.5" fill="var(--mkt)"><title>${fdate(r.date)} · ${INR(r.value)} (invested ${INR(r.invested)})</title></circle>`; });
  const every = Math.ceil(rows.length / 7); rows.forEach((r, i) => { if (i % every === 0 || i === rows.length - 1) s += `<text x="${x(i)}" y="${H - 4}" text-anchor="middle">${fdate(r.date)}</text>`; });
  return s + '</svg>';
}

  </div>
  ${B.lab_term ? (() => { const [w, mean, ex] = String(B.lab_term).split('|'); return `<div class="term"><div class="h" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--acc)">📘 Term of the day</div><div class="w">${esc(w)}</div><p>${esc(mean)}</p>${ex ? `<p class="note"><b>Example:</b> ${esc(ex)}</p>` : ''}</div>`; })() : ''}
  <div class="card"><h3>🎤 Interview question</h3><p class="prompt" style="font-size:17px">${esc(B.lab_interview)}</p>${B.lab_answer ? `<details class="d"><summary>Short model answer</summary><p style="margin:0">${esc(B.lab_answer)}</p></details>` : ''}</div></section>
  <section class="sec" id="li" style="--acc:var(--li)"><div class="sec-h"><div class="ico">🔗</div><h2>LinkedIn reads</h2><p class="sub">One deep read a day from what you shared</p></div>
  ${(() => { const L = D.li || [], shown = L.filter((r) => r.shown_on).sort((a, b) => String(b.shown_on).localeCompare(String(a.shown_on))), unread = L.filter((r) => !r.shown_on && r.status === 'unreadable'), queued = L.filter((r) => !r.shown_on && r.status !== 'unreadable').sort((a, b) => String(a.shared_at).localeCompare(String(b.shared_at)));
    const feat = shown.find((r) => r.shown_on === D.today) || shown[0], past = shown.filter((r) => r !== feat).slice(0, 10);
    const link = (r) => { const x = (r.shared_links || []).find((l) => /^https?:[/][/]/.test(String(l))) || ''; return x ? `<a href="${esc(x)}" target="_blank" rel="noopener">${esc(r.share_subject || x)}</a>` : esc(r.share_subject || r.share_text || 'Shared item'); };
    const qrow = (r) => `<li><span>${r.shared_at ? esc(fdate(String(r.shared_at).slice(0, 10))) : ''}</span>${link(r)}</li>`;
    return (feat ? `<p class="sub">${feat.shown_on === D.today ? "Today's read" : 'Latest read · ' + esc(fdate(feat.shown_on))}${feat.auto ? ' · picked for you' : ' · from your queue'} · ${queued.length ? queued.length + ' more waiting in your queue' : 'queue empty'}</p>${liCard(feat)}` : '<p class="note">Nothing yet. Share a link and it appears here the next morning.</p>')
      + (queued.length ? `<details class="d" open><summary>Waiting in your queue (${queued.length}), oldest first</summary><ul class="qlist">${queued.map(qrow).join('')}</ul></details>` : '')
      + (unread.length ? `<details class="d" open><summary>Couldn't be opened automatically (${unread.length})</summary><p class="warn">LinkedIn blocks automated reading of short lnkd.in links, so these have no words to search on. Tap one to open it, then share it again with the updated shortcut, ideally with a few words about it.</p><ul class="qlist">${unread.map(qrow).join('')}</ul></details>` : '')
      + (past.length ? `<details class="d"><summary>Earlier reads (${past.length})</summary><div class="grid">${past.map(liCard).join('')}</div></details>` : ''); })()}
</section>
  <section class="sec" id="vc" style="--acc:var(--vc)"><div class="sec-h"><div class="ico">💼</div><h2>Venture school</h2><p class="sub">Venture capital from zero, 6 weeks, one lesson each weekday</p></div>
  <div id="vc-root"></div>
</section>
  <section class="sec" id="brain" style="--acc:var(--brain)"><div class="sec-h"><div class="ico">🧠</div><h2>Brain gym</h2><p class="sub">About 5 minutes: memory, speed and focus</p></div>
  <div class="card tint"><div class="bg-stats" id="bg-stats"></div><div class="bg-tabs" id="bg-tabs"></div><div class="bg-stage" id="bg-stage"></div></div>
  <p class="note" style="font-size:11px">Games mainly make you better at the game itself. What helps everyday memory most is regularly recalling what you learned, good sleep, and exercise.</p>
</section>
  <p class="foot">Refreshed ${esc(D.generated_label)} · <a href="#" id="forget" style="color:inherit">Forget this device</a></p>
  </div>`;
  const hs = document.getElementById('hs'); if (hs) hs.addEventListener('change', () => { document.getElementById('hb').innerHTML = holdingsRows(h, hs.value); });
  document.getElementById('forget').addEventListener('click', (e) => { e.preventDefault(); try { localStorage.removeItem('pmd_k'); } catch (_) {} location.reload(); });
  initBrain();
  initVC(D.vc, D.today);
}
function initVC(V, todayIso) {
  const root = document.getElementById('vc-root');
  if (!root) return;
  if (!V || !(V.lessons || []).length) { root.innerHTML = '<p class="note">The course will appear after the next refresh.</p>'; return; }
  const LS = V.lessons, N = LS.length;
  const today = todayIso || new Date().toLocaleDateString('en-CA', {timeZone: 'Asia/Kolkata'});
  const load = () => { try { return JSON.parse(localStorage.getItem('pmd_vc') || '{}') || {}; } catch (_) { return {}; } };
  const store = (o) => { try { localStorage.setItem('pmd_vc', JSON.stringify(o)); } catch (_) {} };
  // weekday count from start (start = day 1); weekends show Friday's lesson
  const dayFor = (iso) => { const s = new Date(V.start + 'T12:00:00Z'), t = new Date(iso + 'T12:00:00Z'); if (t < s) return 0; let n = 0; for (let d = new Date(s); d <= t; d.setUTCDate(d.getUTCDate() + 1)) { const w = d.getUTCDay(); if (w !== 0 && w !== 6) n++; } return Math.min(n, N); };
  const sched = dayFor(today);
  let cur = Math.max(1, sched);
  const tbl = (t) => t && t.length ? `<div class="tw"><table><thead><tr>${t[0].map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${t.slice(1).map((r) => `<tr>${r.map((c, i) => `<td${i ? ' class="r"' : ''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '';
  function draw() {
    const st = load(), done = new Set(st.done || []), x = LS[cur - 1];
    const label = sched === 0 ? (cur === 1 ? `Starts ${esc(fdate(V.start, {weekday: 'long', day: 'numeric', month: 'short'}))} · preview of day 1` : 'Reading ahead') : cur === sched ? (sched === N ? "Final lesson" : "Today's lesson") : cur < sched ? 'Earlier lesson' : 'Reading ahead';
    root.innerHTML = `<div class="card tint">
      <div class="vc-top"><span class="pill">Week ${x.week} · Day ${x.day} of ${N}</span><span class="sub">${label}</span></div>
      <p class="sub" style="margin:8px 0 0">${esc(V.weeks[x.week] || '')}</p>
      <h3 style="margin:6px 0 0;font-size:20px">${esc(x.title)}</h3>
      <p class="vc-idea">${esc(x.idea)}</p>
      <div class="vc-prog" title="${done.size} of ${N} lessons understood"><i style="width:${Math.round(done.size / N * 100)}%"></i></div>
      <p class="note" style="margin:0">${done.size} of ${N} lessons marked understood</p></div>
    <div class="card vc-body">${(x.explain || []).map((p) => `<p>${esc(p)}</p>`).join('')}</div>
    <div class="vc-ex"><div class="h" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--acc)">🧮 The example: ${esc(x.ex_title)}</div><ul>${(x.ex || []).map((l) => `<li>${esc(l)}</li>`).join('')}</ul>${tbl(x.table)}</div>
    ${x.investors ? `<div class="card"><h3>👀 What investors look at</h3><p style="margin:0">${esc(x.investors)}</p></div>` : ''}
    ${x.q ? `<div class="card"><h3>✅ Check yourself</h3><p class="prompt" style="font-size:16px">${esc(x.q)}</p><details class="d"><summary>Answer</summary><p style="margin:0">${esc(x.a)}</p></details></div>` : ''}
    <div class="vc-nav"><button class="bg-btn" id="vc-prev" ${cur <= 1 ? 'disabled' : ''}>← Previous</button>
      <label class="sub" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="vc-done" ${done.has(cur) ? 'checked' : ''}> I understood this</label>
      <button class="bg-btn" id="vc-next" ${cur >= N ? 'disabled' : ''}>Next →</button></div>
    <details class="d"><summary>Course map: all ${N} lessons</summary><div class="vc-map">${Object.keys(V.weeks).map((w) => `<div><div class="wk">Week ${w}: ${esc(V.weeks[w])}</div><ol start="${LS.find((l) => String(l.week) === w).day}">${LS.filter((l) => String(l.week) === w).map((l) => `<li class="${l.day === cur ? 'cur' : done.has(l.day) ? 'done' : ''}"><a data-d="${l.day}">${esc(l.title)}</a>${l.day === sched ? ' <span class="sub">· today</span>' : ''}</li>`).join('')}</ol></div>`).join('')}</div></details>`;
    const go = (d) => { cur = Math.min(N, Math.max(1, d)); draw(); document.getElementById('vc').scrollIntoView({behavior: 'smooth'}); };
    document.getElementById('vc-prev').onclick = () => go(cur - 1);
    document.getElementById('vc-next').onclick = () => go(cur + 1);
    document.getElementById('vc-done').onchange = (e) => { const s2 = load(), d2 = new Set(s2.done || []); e.target.checked ? d2.add(cur) : d2.delete(cur); s2.done = [...d2]; store(s2); draw(); };
    root.querySelectorAll('[data-d]').forEach((a) => { a.onclick = () => go(Number(a.dataset.d)); });
  }
  draw();
}
function initBrain() {
  const stage = document.getElementById('bg-stage'), tabs = document.getElementById('bg-tabs'), statsEl = document.getElementById('bg-stats');
  if (!stage) return;
  const today = new Date().toLocaleDateString('en-CA', {timeZone: 'Asia/Kolkata'});
  const load = () => { try { return JSON.parse(localStorage.getItem('pmd_brain') || '{}') || {}; } catch (_) { return {}; } };
  const store = (o) => { try { localStorage.setItem('pmd_brain', JSON.stringify(o)); } catch (_) {} };
  let timers = [];
  const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  function streak(days) {
    const set = new Set(days || []); let n = 0; const d = new Date(today + 'T12:00:00Z');
    if (!set.has(today)) d.setUTCDate(d.getUTCDate() - 1);
    for (let i = 0; i < 90; i++) { const k = d.toISOString().slice(0, 10), wd = d.getUTCDay();
      if (set.has(k)) n++; else if (wd !== 0 && wd !== 6) break;
      d.setUTCDate(d.getUTCDate() - 1); }
    return n;
  }
  function stats() {
    const s = load(), b = s.best || {};
    statsEl.innerHTML = `<span>🔥 Streak <b>${streak(s.days)}</b> day${streak(s.days) === 1 ? '' : 's'} (weekends don't break it)</span><span>🔢 Best memory <b>${b.digits || '–'}</b> digits</span><span>➗ Best maths <b>${b.maths || '–'}</b>/min</span><span>🎨 Best focus <b>${b.colour ?? '–'}</b></span>`;
  }
  function save(key, val) {
    const s = load(); s.best = s.best || {}; s.days = s.days || [];
    const isBest = s.best[key] === undefined || val > s.best[key];
    if (isBest) s.best[key] = val;
    if (!s.days.includes(today)) { s.days.push(today); s.days = s.days.slice(-120); }
    store(s); stats(); return isBest;
  }
  const intro = (title, what, why, start) => { stage.innerHTML = `<div class="bg-big" style="font-size:22px;letter-spacing:0">${title}</div><p class="bg-sub">${what}</p><p class="bg-sub"><b>Trains:</b> ${why}</p><button class="bg-btn pri" id="bg-go">Start</button>`; document.getElementById('bg-go').onclick = start; };

  function digits() {
    let len = 4, round = 0, best = 0; const ROUNDS = 8;
    const next = () => {
      if (round >= ROUNDS) return done();
      round++; let n = String(rnd(1, 9)); while (n.length < len) n += rnd(0, 9);
      stage.innerHTML = `<p class="bg-sub">Round ${round} of ${ROUNDS} · ${len} digits · memorise</p><div class="bg-big">${n.replace(/(\d{3})(?=\d)/g, '$1 ')}</div>`;
      later(() => {
        stage.innerHTML = `<p class="bg-sub">Type the number you saw</p><form id="bg-f" class="bg-row"><input id="bg-i" class="bg-in" inputmode="numeric" autocomplete="off"><button class="bg-btn pri">Check</button></form>`;
        const i = document.getElementById('bg-i'); i.focus();
        document.getElementById('bg-f').onsubmit = (e) => { e.preventDefault();
          const ok = i.value.replace(/\D/g, '') === n;
          if (ok) { best = Math.max(best, len); len++; } else len = Math.max(3, len - 1);
          stage.innerHTML = `<div class="bg-big ${ok ? 'ok' : 'no'}">${ok ? '✓ Correct' : '✗ It was ' + n}</div>`;
          later(next, ok ? 700 : 1500); };
      }, 900 + len * 500);
    };
    const done = () => { const nb = save('digits', best);
      stage.innerHTML = `<div class="bg-big">${best || 0} digits</div><p class="bg-sub">${nb && best ? 'New personal best! ' : ''}Most adults hold about 7. Tip: group digits in threes, like a phone number, and say them in your head.</p><button class="bg-btn pri" id="bg-again">Go again</button>`;
      document.getElementById('bg-again').onclick = digits; };
    intro('Number memory', 'A number flashes up, then hides. Type it back. It grows by one digit when you get it right.', 'working memory, the mental notepad you use to hold numbers, names and ideas while you think.', next);
  }

  function maths() {
    let score = 0, ans = 0, end = 0;
    const gen = () => { const op = rnd(0, 2); let a, b, q;
      if (op === 0) { a = rnd(12, 99); b = rnd(12, 99); q = `${a} + ${b}`; ans = a + b; }
      else if (op === 1) { a = rnd(20, 120); b = rnd(3, a - 1); q = `${a} − ${b}`; ans = a - b; }
      else { a = rnd(3, 12); b = rnd(3, 19); q = `${a} × ${b}`; ans = a * b; }
      document.getElementById('bg-q').textContent = q; const i = document.getElementById('bg-i'); i.value = ''; i.focus(); };
    const start = () => { score = 0; end = Date.now() + 60000;
      stage.innerHTML = `<p class="bg-sub"><span id="bg-t">60</span>s left · <span id="bg-s">0</span> correct</p><div class="bg-big" id="bg-q"></div><div class="bg-row"><input id="bg-i" class="bg-in" inputmode="numeric" autocomplete="off"><button class="bg-btn" id="bg-skip">Skip</button></div>`;
      const i = document.getElementById('bg-i');
      i.oninput = () => { if (Number(i.value) === ans && i.value !== '') { score++; document.getElementById('bg-s').textContent = score; gen(); } };
      document.getElementById('bg-skip').onclick = gen; gen();
      const tick = () => { const left = Math.max(0, Math.ceil((end - Date.now()) / 1000)); const t = document.getElementById('bg-t'); if (!t) return; t.textContent = left; if (left <= 0) return done(); later(tick, 250); }; tick(); };
    const done = () => { const nb = save('maths', score);
      stage.innerHTML = `<div class="bg-big">${score} in a minute</div><p class="bg-sub">${nb && score ? 'New personal best! ' : ''}Tip: for 47 + 38, do 47 + 40 − 2. Rounding and adjusting is faster than carrying digits.</p><button class="bg-btn pri" id="bg-again">Go again</button>`;
      document.getElementById('bg-again').onclick = start; };
    intro('Quick maths', 'Solve as many as you can in 60 seconds. The next one appears as soon as your answer is right.', 'processing speed, useful for estimation questions and quick numbers in meetings.', start);
  }

  function colour() {
    const C = [['RED', '#f43f5e'], ['GREEN', '#22c55e'], ['BLUE', '#3b82f6'], ['YELLOW', '#eab308']];
    let ok = 0, bad = 0, ink = 0, shownAt = 0, times = [], end = 0;
    const gen = () => { const w = rnd(0, 3); ink = Math.random() < 0.75 ? (w + rnd(1, 3)) % 4 : w;
      const el = document.getElementById('bg-w'); el.textContent = C[w][0]; el.style.color = C[ink][1]; shownAt = performance.now(); };
    const start = () => { ok = 0; bad = 0; times = []; end = Date.now() + 30000;
      stage.innerHTML = `<p class="bg-sub"><span id="bg-t">30</span>s · tap the colour of the INK, not the word</p><div class="bg-big" id="bg-w"></div><div class="bg-row">${C.map((c, k) => `<button class="bg-btn" data-k="${k}">${c[0].toLowerCase()}</button>`).join('')}</div>`;
      stage.querySelectorAll('[data-k]').forEach((btn) => { btn.onclick = () => { if (Date.now() > end) return; times.push(performance.now() - shownAt);
        if (Number(btn.dataset.k) === ink) ok++; else { bad++; stage.style.outline = '2px solid var(--down)'; later(() => { stage.style.outline = ''; }, 200); } gen(); }; });
      gen();
      const tick = () => { const left = Math.max(0, Math.ceil((end - Date.now()) / 1000)); const t = document.getElementById('bg-t'); if (!t) return; t.textContent = left; if (left <= 0) return done(); later(tick, 250); }; tick(); };
    const done = () => { const sc = ok - bad, avg = times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) : 0, nb = save('colour', sc);
      stage.innerHTML = `<div class="bg-big">Score ${sc}</div><p class="bg-sub">${ok} right, ${bad} wrong, about ${(avg / 1000).toFixed(2)}s per answer. ${nb ? 'New personal best! ' : ''}Accuracy first, then speed.</p><button class="bg-btn pri" id="bg-again">Go again</button>`;
      document.getElementById('bg-again').onclick = start; };
    intro('Colour clash', 'A colour word appears in a different colour of ink. Tap the ink colour as fast as you can for 30 seconds.', 'focus and fast decisions: ignoring the obvious-but-wrong signal and acting on the right one.', start);
  }

  const D = [['🔢 Number memory', digits], ['➗ Quick maths', maths], ['🎨 Colour clash', colour]];
  const pick = (k) => { clear(); stage.style.outline = ''; tabs.querySelectorAll('button').forEach((b, j) => b.classList.toggle('on', j === k)); D[k][1](); };
  tabs.innerHTML = D.map((d) => `<button type="button">${d[0]}</button>`).join('');
  tabs.querySelectorAll('button').forEach((b, k) => { b.onclick = () => pick(k); });
  stats();
  const dow = new Date(today + 'T12:00:00Z').getUTCDay();
  pick(dow % 3);
}
</script>
